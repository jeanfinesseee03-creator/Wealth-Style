<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wealth Style - Acid Wash T-Shirts</title>
    <meta name="description" content="Wealth Style: oversized 250 GSM acid wash t-shirts. Wear your wealth.">
    <meta name="theme-color" content="#000814">
    <meta property="og:title" content="Wealth Style - Acid Wash T-Shirts">
    <meta property="og:description" content="Oversized 250 GSM acid wash t-shirts. Wear your wealth.">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👑</text></svg>">

    <!-- Stripe.js: must be loaded directly from Stripe (never copy or self-host it) -->
    <script src="https://js.stripe.com/dahlia/stripe.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html {
            scroll-behavior: smooth;
            scroll-padding-top: 70px; /* keeps section titles clear of the fixed header */
        }

        body {
            background: #000814;
            font-family: Arial, sans-serif;
            overflow-x: hidden;
            color: #fff;
        }

        :focus-visible { outline: 3px solid gold; outline-offset: 2px; }

        /* ---------- Header / nav ---------- */
        header {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            z-index: 100;
        }

        .logo { color: white; font-size: 1.5rem; font-weight: bold; }

        .hamburger {
            display: none;
            flex-direction: column;
            gap: 5px;
            background: none;
            border: none;
            padding: 6px;
            cursor: pointer;
        }

        .hamburger span {
            width: 25px;
            height: 3px;
            background: white;
            border-radius: 2px;
            transition: 0.3s;
        }

        .hamburger.active span:nth-child(1) { transform: rotate(45deg) translate(5px, 6px); }
        .hamburger.active span:nth-child(2) { opacity: 0; }
        .hamburger.active span:nth-child(3) { transform: rotate(-45deg) translate(5px, -6px); }

        nav { display: flex; gap: 30px; }

        nav a { color: white; text-decoration: none; transition: color 0.3s; }
        nav a:hover { color: gold; }

        @media (max-width: 768px) {
            header { padding: 12px 15px; }
            .logo { font-size: 1.2rem; }
            .hamburger { display: flex; }

            nav {
                position: fixed;
                top: 56px;
                left: 0;
                width: 100%;
                flex-direction: column;
                background: rgba(0, 0, 0, 0.95);
                padding: 20px;
                gap: 0;
                transform: translateX(-100%);
                visibility: hidden;
                transition: transform 0.3s, visibility 0.3s;
                z-index: 99;
            }

            nav.active { transform: translateX(0); visibility: visible; }
            nav a { padding: 15px 10px; font-size: 1.1rem; }
        }

        /* ---------- Space background ---------- */
        .space-background {
            position: fixed;
            inset: 0;
            background:
                radial-gradient(2px 2px at 20px 30px, #eee, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 60px 70px, #fff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 50px 50px, #fff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 130px 80px, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 90px 10px, #fff, rgba(0,0,0,0));
            background-size: 200px 200px;
            animation: twinkle 5s infinite;
            z-index: 1;
            pointer-events: none;
        }

        .stars { position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }

        /* One layer that slowly drifts upward. It is 2x the screen height and holds two
           identical copies of the stars, so the loop is seamless. Only transform is animated,
           which the browser handles on the graphics chip (no repainting). */
        .star-field {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 200%;
            animation: drift 150s linear infinite;
            will-change: transform;
        }

        @keyframes drift {
            from { transform: translate3d(0, 0, 0); }
            to   { transform: translate3d(0, -50%, 0); }
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0.7;
        }

        /* Only some stars twinkle, which keeps the number of running animations low */
        .star.twinkle { animation: twinkle-star 3s infinite; }

        /* Shooting stars: just two elements, each visible for under a second per cycle */
        .shooting-star {
            position: absolute;
            width: 130px;
            height: 2px;
            border-radius: 2px;
            background: linear-gradient(to right, rgba(255,255,255,0), #fff);
            opacity: 0;
            will-change: transform, opacity;
        }

        .shooting-star.s1 { top: 8%;  left: 12%; animation: shoot 11s linear infinite 3s; }
        .shooting-star.s2 { top: 22%; left: 55%; animation: shoot 17s linear infinite 9s; }

        @keyframes shoot {
            0%   { transform: rotate(35deg) translateX(0);     opacity: 0; }
            1%   { opacity: 1; }
            6%   { transform: rotate(35deg) translateX(650px); opacity: 0; }
            100% { transform: rotate(35deg) translateX(650px); opacity: 0; }
        }

        @keyframes twinkle-star { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
        @keyframes twinkle { 0%, 100% { opacity: 1; } 50% { opacity: 0.8; } }
        @keyframes float { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(30px, 30px); } }

        .nebula {
            position: fixed;
            border-radius: 50%;
            filter: blur(60px);
            will-change: transform;
            opacity: 0.3;
            z-index: 1;
            pointer-events: none;
        }

        .nebula-1 {
            width: 400px; height: 400px;
            background: radial-gradient(circle, rgba(138, 43, 226, 0.5) 0%, transparent 70%);
            top: 10%; left: 10%;
            animation: float 20s infinite ease-in-out;
        }
        .nebula-2 {
            width: 300px; height: 300px;
            background: radial-gradient(circle, rgba(30, 144, 255, 0.4) 0%, transparent 70%);
            top: 50%; right: 10%;
            animation: float 25s infinite ease-in-out reverse;
        }
        .nebula-3 {
            width: 350px; height: 350px;
            background: radial-gradient(circle, rgba(220, 20, 60, 0.3) 0%, transparent 70%);
            bottom: 10%; left: 50%;
            animation: float 30s infinite ease-in-out;
        }

        @media (prefers-reduced-motion: reduce) {
            html { scroll-behavior: auto; }
            .space-background, .star-field, .star.twinkle, .nebula { animation: none; }
            .shooting-star { display: none; }
        }

        /* ---------- Hero ---------- */
        .hero {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 80px 20px 20px;
        }

        .hero h1 {
            font-size: clamp(2.2rem, 8vw, 4rem);
            text-shadow: 0 0 20px rgba(138, 43, 226, 0.8);
            margin-bottom: 20px;
        }

        .hero p {
            color: #ccc;
            font-size: 1.2rem;
            text-shadow: 0 0 10px rgba(30, 144, 255, 0.6);
            margin-bottom: 28px;
        }

        .btn {
            display: inline-block;
            background: linear-gradient(135deg, #8a2be2, #1e90ff);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            text-decoration: none;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }
        .btn:hover { transform: translateY(-2px); }
        .btn:active { transform: scale(0.98); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        /* ---------- Sections ---------- */
        .page-section {
            position: relative;
            z-index: 10;
            padding: 80px 20px 60px;
            background: rgba(0, 0, 0, 0.4);
        }

        @media (min-width: 769px) {
            .page-section { padding: 100px 50px 80px; }
        }

        .page-section h2 {
            text-align: center;
            font-size: 2rem;
            margin-bottom: 40px;
            text-shadow: 0 0 20px rgba(138, 43, 226, 0.8);
        }

        @media (min-width: 769px) { .page-section h2 { font-size: 2.5rem; } }

        #contact { min-height: 50vh; }
        #contact p { text-align: center; color: #ccc; font-size: 1.1rem; margin-bottom: 10px; }
        #contact a { color: gold; font-weight: bold; text-decoration: none; }
        #contact a:hover { text-decoration: underline; }

        /* ---------- Products ---------- */
        .products {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        @media (min-width: 640px) { .products { grid-template-columns: repeat(2, 1fr); } }
        @media (min-width: 1024px) {
            .products { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; }
        }

        .product {
            background: rgba(138, 43, 226, 0.1);
            border: 2px solid rgba(138, 43, 226, 0.5);
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        @media (hover: hover) {
            .product:hover { transform: translateY(-8px); box-shadow: 0 0 20px rgba(138, 43, 226, 0.8); }
        }

        .image-container {
            position: relative;
            display: block;
            width: 100%;
            aspect-ratio: 1 / 1;
            margin-bottom: 15px;
            border: none;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            background: rgba(0, 0, 0, 0.2);
        }

        .image-container img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: opacity 0.3s ease;
        }

        .image-container img.back { opacity: 0; }
        .image-container.flipped img.front { opacity: 0; }
        .image-container.flipped img.back { opacity: 1; }

        .view-indicator {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.75);
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 0.75rem;
        }

        .product h3 { font-size: 1.2rem; margin-bottom: 8px; }
        .product .price { font-size: 1.15rem; color: gold; margin-bottom: 12px; }

        .size-picker {
            border: none;
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 14px;
        }

        .size-picker legend {
            color: #ccc;
            font-size: 0.85rem;
            margin: 0 auto 8px;
        }

        .size-picker label { cursor: pointer; }
        .size-picker input { position: absolute; opacity: 0; pointer-events: none; }

        .size-picker span {
            display: inline-block;
            min-width: 44px;
            padding: 8px 10px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 5px;
            font-size: 0.9rem;
        }

        .size-picker input:checked + span { background: gold; color: #000; border-color: gold; font-weight: bold; }
        .size-picker input:focus-visible + span { outline: 3px solid #1e90ff; outline-offset: 2px; }

        .product .btn { width: 100%; }

        .size-error { color: #ff6b81; font-size: 0.85rem; min-height: 1.2em; margin-bottom: 6px; }

        /* ---------- Cart drawer ---------- */
        .cart-toggle-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #8a2be2, #1e90ff);
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            z-index: 60;
            box-shadow: 0 4px 15px rgba(138, 43, 226, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cart-count {
            position: absolute;
            top: -4px;
            right: -4px;
            min-width: 22px;
            height: 22px;
            padding: 0 5px;
            border-radius: 11px;
            background: gold;
            color: #000;
            font-size: 0.8rem;
            font-weight: bold;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .cart-count.show { display: flex; }

        #cart {
            position: fixed;
            top: 0;
            right: 0;
            height: 100%;
            width: min(380px, 100%);
            background: rgba(0, 8, 20, 0.97);
            border-left: 2px solid rgba(138, 43, 226, 0.8);
            padding: 20px 15px;
            z-index: 150;
            display: flex;
            flex-direction: column;
            transform: translateX(100%);
            visibility: hidden;
            transition: transform 0.3s ease, visibility 0.3s;
        }

        #cart.visible { transform: translateX(0); visibility: visible; }

        .cart-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .cart-head h2 { color: gold; font-size: 1.3rem; }

        .icon-btn {
            background: transparent;
            border: none;
            color: white;
            font-size: 1.8rem;
            line-height: 1;
            cursor: pointer;
            padding: 4px 8px;
        }

        #cart-items { flex: 1; overflow-y: auto; margin-bottom: 15px; color: #ccc; }

        .cart-item {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
            padding: 10px;
            background: rgba(138, 43, 226, 0.2);
            border-radius: 5px;
            border-left: 3px solid rgba(138, 43, 226, 0.8);
            font-size: 0.9rem;
        }

        .cart-item-image { width: 70px; height: 70px; object-fit: contain; border-radius: 5px; background: rgba(0,0,0,0.3); }
        .cart-item-info { flex: 1; }
        .cart-item-name { color: #fff; font-weight: bold; margin-bottom: 3px; }
        .cart-item-meta { color: #ccc; font-size: 0.85rem; margin-bottom: 6px; }
        .cart-item-price { color: gold; font-weight: bold; }

        .qty-row { display: flex; align-items: center; gap: 8px; margin-top: 6px; }

        .qty-btn {
            width: 28px; height: 28px;
            border-radius: 5px;
            border: 1px solid rgba(255,255,255,0.4);
            background: transparent;
            color: white;
            cursor: pointer;
            font-size: 1rem;
        }

        .remove-btn {
            margin-left: auto;
            background: #dc143c;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 3px;
            font-size: 0.8rem;
            cursor: pointer;
        }

        #cart-total {
            color: gold;
            border-top: 1px solid rgba(138, 43, 226, 0.5);
            padding-top: 10px;
            font-size: 1.1rem;
            margin-bottom: 12px;
        }

        #cart .btn { width: 100%; }

        .cart-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 140;
            display: none;
        }
        .cart-backdrop.show { display: block; }

        /* ---------- Checkout modal ---------- */
        .checkout-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }
        .checkout-modal.active { display: flex; }

        .checkout-modal-content {
            width: min(500px, 100%);
            max-height: 100%;
            overflow-y: auto;
            background: #0d1324;
            border: 2px solid rgba(138, 43, 226, 0.8);
            border-radius: 12px;
            padding: 22px;
            position: relative;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45);
        }

        .checkout-modal-content .icon-btn { position: absolute; top: 10px; right: 10px; }
        .checkout-modal-content h3 { color: gold; margin-bottom: 12px; font-size: 1.5rem; }
        .checkout-modal-content p { color: #d6d6d6; font-size: 0.95rem; margin-bottom: 16px; }

        #stripe-checkout-form { min-height: 20px; }
        #checkout-message { margin-bottom: 0; }
    </style>
</head>
<body>
    <header>
        <div class="logo">WEALTH STYLE</div>

        <button class="hamburger" id="hamburger" aria-label="Open menu" aria-expanded="false" aria-controls="nav">
            <span></span><span></span><span></span>
        </button>

        <nav id="nav" aria-label="Main">
            <a href="#home">Home</a>
            <a href="#shop">Shop</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <div class="space-background"></div>
    <div class="stars">
        <div class="shooting-star s1"></div>
        <div class="shooting-star s2"></div>
    </div>
    <div class="nebula nebula-1"></div>
    <div class="nebula nebula-2"></div>
    <div class="nebula nebula-3"></div>

    <main>
        <div class="hero" id="home">
            <div>
                <h1>WEALTH STYLE</h1>
                <p>Wear Your Wealth</p>
                <a class="btn" href="#shop">Shop the collection</a>
            </div>
        </div>

        <section class="page-section" id="shop">
            <h2>Acid Wash Oversize T-Shirt Collection</h2>
            <div class="products" id="products"></div>
        </section>

        <section class="page-section" id="contact">
            <h2>Contact Us</h2>
            <p>📧 Email: <a href="mailto:jean.cas03@outlook.com">jean.cas03@outlook.com</a></p>
            <p style="margin-top: 20px; font-size: 1rem;">Feel free to reach out with any questions about our Acid Wash T-Shirts!</p>
        </section>
    </main>

    <button class="cart-toggle-btn" id="cartToggle" aria-label="Open cart" aria-controls="cart">
        🛒<span class="cart-count" id="cart-count">0</span>
    </button>

    <div class="cart-backdrop" id="cart-backdrop"></div>

    <aside id="cart" aria-label="Shopping cart">
        <div class="cart-head">
            <h2>Your Cart 🛒</h2>
            <button class="icon-btn" id="cart-close" aria-label="Close cart">×</button>
        </div>
        <div id="cart-items"></div>
        <h3 id="cart-total">Total: $0</h3>
        <button id="checkout-btn" class="btn" disabled>Checkout</button>
    </aside>

    <div id="checkout-modal" class="checkout-modal" role="dialog" aria-modal="true" aria-labelledby="checkout-title">
        <div class="checkout-modal-content">
            <button class="icon-btn" type="button" id="checkout-close" aria-label="Close checkout">×</button>
            <h3 id="checkout-title">Checkout</h3>
            <div id="checkout-body">
                <div id="stripe-checkout-form"></div>
                <p id="checkout-message" role="alert"></p>
            </div>
        </div>
    </div>

    <script>
        /* =========================================================
           EDIT YOUR STORE HERE
           ========================================================= */
        const SIZES = ['S', 'M', 'L', 'XL'];

        // 1) Your Stripe PUBLISHABLE key (starts with pk_test_ or pk_live_). Safe to put here.
        //    NEVER put your secret key (sk_...) in this file.
        const STRIPE_PUBLISHABLE_KEY = 'pk_test_51Uel8z0WMIkOZAZyvptRo3aVATgCidivkQHxJfQLiX4vpLWa8a5Qi7UZrd8PZN1acuQDYpAYmvjYwF4gVQ0HA7QX0088CDk416...';

        // 2) Your Vercel project address, no slash at the end (see STRIPE_SETUP.md)
        const API_BASE = 'https://wealth-project.vercel.app';
        const API_URL = API_BASE + '/api/create-checkout-session';

        // To rename a shirt, change its name. To swap photos, change front/back.
        // If you change ids, names or prices here, change them in the Vercel function too.
        const PRODUCTS = [
            { id: 'tee-1', name: 'Acid Wash T-Shirt - Color 1', price: 25, front: 'Acid Wash Oversize T-Shirt - 250 GSM-mockups-1.png',  back: 'Acid Wash Oversize T-Shirt - 250 GSM-mockups-2.png' },
            { id: 'tee-2', name: 'Acid Wash T-Shirt - Color 2', price: 25, front: 'Acid Wash Oversize T-Shirt - 250 GSM-mockups-3.png',  back: 'Acid Wash Oversize T-Shirt - 250 GSM-mockups-4.png' },
            { id: 'tee-3', name: 'Acid Wash T-Shirt - Color 3', price: 25, front: 'Acid Wash Oversize T-Shirt - 250 GSM-mockups-5.png',  back: 'Acid Wash Oversize T-Shirt - 250 GSM-mockups-6.png' },
            { id: 'tee-4', name: 'Acid Wash T-Shirt - Color 4', price: 25, front: 'Acid Wash Oversize T-Shirt - 250 GSM-mockups-11.png', back: 'Acid Wash Oversize T-Shirt - 250 GSM-mockups-12.png' },
            { id: 'tee-5', name: 'Acid Wash T-Shirt - Color 5', price: 25, front: 'Acid Wash Oversize T-Shirt - 250 GSM-mockups-15.png', back: 'Acid Wash Oversize T-Shirt - 250 GSM-mockups-16.png' }
        ];
        /* ========================================================= */

        const $ = (id) => document.getElementById(id);
        const money = (n) => '$' + n;
        const byId = (id) => PRODUCTS.find(p => p.id === id);
        const encodeSrc = (path) => encodeURI(path); // handles spaces in file names

        /* ---------- Menu ---------- */
        const hamburger = $('hamburger');
        const nav = $('nav');

        function setMenu(open) {
            hamburger.classList.toggle('active', open);
            nav.classList.toggle('active', open);
            hamburger.setAttribute('aria-expanded', String(open));
        }

        hamburger.addEventListener('click', () => setMenu(!nav.classList.contains('active')));
        nav.querySelectorAll('a').forEach(a => a.addEventListener('click', () => setMenu(false)));

        /* ---------- Product grid ---------- */
        function renderProducts() {
            $('products').innerHTML = PRODUCTS.map(p => `
                <article class="product" data-id="${p.id}">
                    <button type="button" class="image-container" aria-label="Flip ${p.name} to see the back">
                        <img class="front" src="${encodeSrc(p.front)}" alt="${p.name}, front" loading="lazy">
                        <img class="back" src="${encodeSrc(p.back)}" alt="${p.name}, back" loading="lazy">
                        <span class="view-indicator">View back</span>
                    </button>
                    <h3>${p.name}</h3>
                    <p class="price">${money(p.price)}</p>
                    <fieldset class="size-picker">
                        <legend>Size</legend>
                        ${SIZES.map(s => `
                            <label>
                                <input type="radio" name="size-${p.id}" value="${s}">
                                <span>${s}</span>
                            </label>`).join('')}
                    </fieldset>
                    <p class="size-error" role="alert"></p>
                    <button type="button" class="btn add-btn">Add to cart</button>
                </article>
            `).join('');
        }

        $('products').addEventListener('click', (e) => {
            const card = e.target.closest('.product');
            if (!card) return;

            const flip = e.target.closest('.image-container');
            if (flip) {
                const flipped = flip.classList.toggle('flipped');
                flip.querySelector('.view-indicator').textContent = flipped ? 'View front' : 'View back';
                return;
            }

            if (e.target.closest('.add-btn')) {
                const size = card.querySelector('input[type="radio"]:checked');
                const error = card.querySelector('.size-error');
                if (!size) {
                    error.textContent = 'Pick a size first.';
                    return;
                }
                error.textContent = '';
                addToCart(card.dataset.id, size.value);
            }
        });

        /* ---------- Cart (saved in the browser so a refresh doesn't empty it) ---------- */
        let cart = [];

        function loadCart() {
            try {
                const saved = JSON.parse(localStorage.getItem('wealthstyle-cart') || '[]');
                // Only keep items that still exist in the catalog; prices always come from PRODUCTS
                cart = saved.filter(i => byId(i.id) && SIZES.includes(i.size) && i.qty > 0);
            } catch (err) {
                cart = [];
            }
        }

        function saveCart() {
            try { localStorage.setItem('wealthstyle-cart', JSON.stringify(cart)); } catch (err) { /* private mode */ }
        }

        const cartTotal = () => cart.reduce((sum, i) => sum + byId(i.id).price * i.qty, 0);
        const cartCount = () => cart.reduce((sum, i) => sum + i.qty, 0);

        function addToCart(id, size) {
            const existing = cart.find(i => i.id === id && i.size === size);
            if (existing) existing.qty += 1;
            else cart.push({ id, size, qty: 1 });
            updateCart();
            openCart();
        }

        function changeQty(index, delta) {
            cart[index].qty += delta;
            if (cart[index].qty <= 0) cart.splice(index, 1);
            updateCart();
        }

        function removeItem(index) {
            cart.splice(index, 1);
            updateCart();
        }

        function updateCart() {
            saveCart();
            const itemsDiv = $('cart-items');
            const count = cartCount();

            $('cart-count').textContent = count;
            $('cart-count').classList.toggle('show', count > 0);
            $('cartToggle').setAttribute('aria-label', `Open cart, ${count} item${count === 1 ? '' : 's'}`);
            $('cart-total').textContent = 'Total: ' + money(cartTotal());
            $('checkout-btn').disabled = cart.length === 0;

            if (cart.length === 0) {
                itemsDiv.innerHTML = '<p>Your cart is empty. Pick a shirt and a size to get started.</p>';
                return;
            }

            itemsDiv.innerHTML = cart.map((item, index) => {
                const p = byId(item.id);
                return `
                <div class="cart-item">
                    <img class="cart-item-image" src="${encodeSrc(p.front)}" alt="${p.name}">
                    <div class="cart-item-info">
                        <div class="cart-item-name">${p.name}</div>
                        <div class="cart-item-meta">Size ${item.size}</div>
                        <div class="cart-item-price">${money(p.price * item.qty)}</div>
                        <div class="qty-row">
                            <button class="qty-btn" aria-label="One fewer" onclick="changeQty(${index}, -1)">−</button>
                            <span>${item.qty}</span>
                            <button class="qty-btn" aria-label="One more" onclick="changeQty(${index}, 1)">+</button>
                            <button class="remove-btn" onclick="removeItem(${index})">Remove</button>
                        </div>
                    </div>
                </div>`;
            }).join('');
        }

        function openCart() {
            $('cart').classList.add('visible');
            $('cart-backdrop').classList.add('show');
        }

        function closeCart() {
            $('cart').classList.remove('visible');
            $('cart-backdrop').classList.remove('show');
        }

        $('cartToggle').addEventListener('click', () => {
            $('cart').classList.contains('visible') ? closeCart() : openCart();
        });
        $('cart-close').addEventListener('click', closeCart);
        $('cart-backdrop').addEventListener('click', closeCart);

        /* ---------- Checkout (Stripe embedded form) ---------- */
        const checkoutModal = $('checkout-modal');

        const appearance = {
            theme: 'flat',
            labels: 'auto',
            inputs: 'spaced',
            variables: {
                borderRadius: '4px',
                colorBackground: '#ffffff',
                colorDanger: '#df1b41',
                colorPrimary: '#0570de',
                colorSuccess: '#00c853',
                colorText: '#30313d',
                fontFamily: 'default',
                fontSizeBase: '16px',
                spacingUnit: '4px'
            }
        };

        async function openCheckout() {
            if (cart.length === 0) return;
            closeCart();
            checkoutModal.classList.add('active');

            const message = $('checkout-message');
            message.textContent = 'Loading secure checkout…';
            $('stripe-checkout-form').innerHTML = '';

            try {
                const stripe = Stripe(STRIPE_PUBLISHABLE_KEY);

                // Only ids, sizes and quantities are sent. Prices are set on the server.
                const clientSecret = fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ items: cart.map(i => ({ id: i.id, size: i.size, qty: i.qty })) })
                })
                    .then((r) => r.json())
                    .then((j) => {
                        if (!j.client_secret) throw new Error(j.error || 'No client secret');
                        return j.client_secret;
                    });

                const checkout = stripe.initCheckoutFormSdk({ clientSecret, appearance });
                const form = checkout.createForm({ layout: 'expanded' });
                form.mount('#stripe-checkout-form');
                message.textContent = '';

                const loaded = await checkout.loadActions();
                if (loaded.type !== 'success') {
                    throw new Error((loaded.error && loaded.error.message) || 'Checkout failed to load');
                }
                form.on('confirm', async (event) => {
                    try {
                        // Cards finish right here; bank-app style methods redirect and come back with ?session_id=
                        const result = await loaded.actions.confirm({ formConfirmEvent: event, redirect: 'if_required' });
                        if (result && result.type === 'error') {
                            // Stripe already shows the error inside the form
                            return;
                        }
                        showThankYou();
                    } catch (error) {
                        console.error('Payment confirmation error:', error);
                        message.textContent = 'Payment could not be confirmed. Please try again.';
                    }
                });
            } catch (err) {
                console.error(err);
                message.textContent = 'Sorry, checkout could not load. Please try again or email us.';
            }
        }

        function showThankYou() {
            cart = [];
            updateCart();
            checkoutModal.classList.add('active');
            $('stripe-checkout-form').innerHTML = '';
            $('checkout-message').textContent = 'Thank you! Your payment was received. A receipt is on its way to your email.';
        }

        // Customer came back from a redirect payment method: check how it went
        async function handleReturnFromStripe() {
            const params = new URLSearchParams(window.location.search);
            const sessionId = params.get('session_id');
            if (!sessionId) return;
            history.replaceState(null, '', window.location.pathname + window.location.hash);
            try {
                const r = await fetch(API_BASE + '/api/session-status?session_id=' + encodeURIComponent(sessionId));
                const s = await r.json();
                if (s.status === 'complete') {
                    showThankYou();
                } else {
                    checkoutModal.classList.add('active');
                    $('checkout-message').textContent = 'Your payment did not go through. Your cart is still saved, so you can try again.';
                }
            } catch (err) {
                console.error(err);
            }
        }

        function closeCheckout() {
            checkoutModal.classList.remove('active');
            $('stripe-checkout-form').innerHTML = '';
            $('checkout-message').textContent = '';
        }

        $('checkout-btn').addEventListener('click', openCheckout);
        $('checkout-close').addEventListener('click', closeCheckout);
        checkoutModal.addEventListener('click', (e) => { if (e.target === checkoutModal) closeCheckout(); });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') { closeCheckout(); closeCart(); setMenu(false); }
        });

        /* ---------- Stars ---------- */
        // Fewer stars on phones, and only every 3rd star twinkles: keeps things smooth.
        const starsContainer = document.querySelector('.stars');
        const starCount = window.innerWidth < 769 ? 40 : 70;
        const field = document.createElement('div');
        field.className = 'star-field';
        const fragment = document.createDocumentFragment();

        for (let i = 0; i < starCount; i++) {
            const size = Math.random() * 3 + 0.5;
            const x = Math.random() * 100;
            const y = Math.random() * 50;          // first half of the tall field
            const duration = Math.random() * 3 + 2;
            const twinkles = i % 3 === 0;

            // Place each star twice (y and y+50%) so the upward drift loops with no jump
            [0, 50].forEach(offset => {
                const star = document.createElement('div');
                star.className = twinkles ? 'star twinkle' : 'star';
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                star.style.left = x + '%';
                star.style.top = (y + offset) + '%';
                if (twinkles) star.style.animationDuration = duration + 's';
                fragment.appendChild(star);
            });
        }

        field.appendChild(fragment);
        starsContainer.appendChild(field);

        /* ---------- Start ---------- */
        renderProducts();
        loadCart();
        updateCart();
        handleReturnFromStripe();
    </script>
</body>
</html>
